# Gate: no CI reference may name a branch that does not exist, or a legacy
# `main`/`master` the target repository has moved off.
#
# Installed here while this repo's `dev` is CLEAN, which is the point. Every
# instance of this rot in the family began in a repo that was fine until
# someone added a file; the cheapest moment to install a check is while it
# passes. See `ci/check-ci-refs.sh` for what each shape of the defect costs
# and why they are deliberately not all treated as fatal.
#
# This file's own trigger list names `dev` and `stable` and NOT `main`,
# because `main` was deleted from this remote and a workflow filtered on a
# branch that no longer exists never runs -- which is exactly the failure
# this gate exists to catch. The gate checks itself along with everything
# else, so reintroducing `main` here fails the very job that would be doing
# it.
name: CI refs

on:
  push:
    branches: [dev, stable]
  pull_request:
    branches: [dev, stable]
  workflow_dispatch:

jobs:
  check-refs:
    name: workflow refs resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Some repos this gate resolves are private, and an unauthenticated
      # `git ls-remote` against them cannot be distinguished from an outage.
      # The gate treats an unreachable remote as a FAILURE under $CI, so it
      # must be able to read every repo it is asked about -- otherwise it
      # would report a private repo as broken.
      - name: Mint a CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      # The self-tests run FIRST and are hermetic: they stub the resolver, so
      # they prove the checker's logic independently of the network and of
      # what happens to be true of these repos today. If the checker were
      # silently matching nothing, the non-vacuity case here is what fails.
      - name: Self-test the checker
        run: ci/check-ci-refs.sh --self-test

      - name: Check this repo's workflow references
        env:
          CI_REFS_GITHUB_TOKEN: ${{ steps.ci_token.outputs.token }}
        run: ci/check-ci-refs.sh
