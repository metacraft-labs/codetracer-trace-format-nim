# =============================================================================
# Downstream lane: this repository's consumers against THIS commit.
#
# WHAT THIS IS
#   codetracer reads traces through this repository's Nim reader (its
#   config.nims puts ../codetracer-trace-format-nim/src on the Nim path), and
#   the recorders write them through its writer: the Nim recorder imports it,
#   and the Rust recorders link codetracer-trace-format's
#   codetracer_trace_writer_nim crate, whose build.rs compiles it. Each of them
#   resolves this repository as a sibling checkout or a pinned flake input, so
#   without this workflow a breaking change here is first seen when a
#   consumer's own CI next runs and moves its pin. This workflow holds a change
#   against them before it reaches `dev`:
#
#       ci/downstream/run-consumers.sh --ct-dir ../codetracer <consumer>
#
#   for each consumer the driver defines (its header says what each one runs
#   and why). It ends with a `TEST-COUNTS:` line and fails on any failed
#   consumer, or one that ran no test (codetracer-specs
#   Testing/Cross-Repo-CI-Integration.md, "trace-format-nim downstream lane").
#
# WORKSPACE LAYOUT
#   This repository is the primary checkout ($GITHUB_WORKSPACE, at
#   `github.sha`), whose directory is named `codetracer-trace-format-nim`.
#   Everything else is cloned beside it, so every consumer finds THIS commit
#   where it looks for the library -- the commit is "swapped in" by position,
#   and the driver refuses to run when it is not (its swap guard):
#
#     $GITHUB_WORKSPACE/../
#       codetracer-trace-format-nim/   <-- actions/checkout, at github.sha
#       codetracer/                    <-- the pinned revision (below)
#       codetracer-trace-format/       <-- the Rust adapter crate
#       codetracer-native-recorder/    <-- the consumers and every sibling
#       codetracer-native-backend/         they need, at codetracer's pins
#       codetracer-ruby-recorder/ ...
#
# WHAT IS PINNED, AND BY WHAT
#   * this repository: `github.sha`, the commit under test;
#   * codetracer: the revision ci/downstream/repro.lock pins, or the 40-hex
#     `codetracer_revision` of a manual dispatch -- NEVER a branch tip. The
#     `resolve` job reads it (ci/downstream/codetracer-revision.sh);
#   * every other repository: codetracer's own locks at that revision, as
#     codetracer's launcher <-> recorder and PHP downstream lanes resolve them
#     (ci/launcher-recorder-e2e-resolve-siblings.sh: repro.lock build inputs,
#     the test lock ci/test/siblings/repro.lock, and the one home of each
#     private sibling). A repository none of them pins fails the job.
#   This repository is passed as `exclude:` to the provisioning action, so its
#   checkout is never reset to the revision codetracer pins for it.
#   To test against a newer codetracer, move the pin (ci/downstream/repro.nim).
#   tests/test_downstream_lane.sh holds this file, the lock, the resolver and
#   the driver to all of the above.
# =============================================================================

name: Downstream

on:
  push:
    branches: [dev, stable]
  pull_request:
    branches: [dev, stable]
  workflow_dispatch:
    inputs:
      codetracer_revision:
        description: >
          A codetracer commit (40 hex digits) to test against instead of the
          one ci/downstream/repro.lock pins. Leave empty to use the lock.
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve the codetracer revision
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read the codetracer pin
        id: rev
        shell: bash
        env:
          INPUT_REV: ${{ github.event.inputs.codetracer_revision }}
        run: bash ci/downstream/codetracer-revision.sh "${INPUT_REV}" >>"${GITHUB_OUTPUT}"

  consumers:
    name: codetracer readers and Nim-writer recorders
    needs: resolve
    runs-on: [self-hosted, linux, x64] # CIP-5 nix job
    # codetracer's ci shell, the recorder builds (ct-mcr, three Rust
    # extensions) and five test suites; bounded so a hung build frees the
    # runner.
    timeout-minutes: 300

    steps:
      - name: Plan the workspace layout
        # Inputs reach the script through `env:`, never by `${{ }}`
        # interpolation into its body.
        id: plan
        shell: bash
        env:
          CT_REV: ${{ needs.resolve.outputs.rev }}
          SELF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "${CT_REV}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the resolve job produced '${CT_REV}', not a 40-hex codetracer commit."
            exit 1
          fi
          if [ "$(basename "${GITHUB_WORKSPACE}")" != codetracer-trace-format-nim ]; then
            echo "::error::the primary checkout is '${GITHUB_WORKSPACE}'; this lane needs it at <parent>/codetracer-trace-format-nim, where every consumer looks for the library."
            exit 1
          fi
          PARENT="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
          CT_DIR="${PARENT}/codetracer"
          echo "commit under test:  ${GITHUB_REPOSITORY}@${SELF_SHA}"
          echo "codetracer:         ${CT_REV} at ${CT_DIR}"
          echo "- under test: \`codetracer-trace-format-nim@${SELF_SHA}\`; codetracer: \`${CT_REV}\`" >>"${GITHUB_STEP_SUMMARY}"
          {
            echo "ct-dir=${CT_DIR}"
            echo "ct-rev=${CT_REV}"
            # Every repository a consumer reads beside codetracer, by NAME:
            # revisions come from codetracer's locks and homes.
            echo "siblings<<TFN_DOWNSTREAM_SIBLINGS_EOF"
            echo "codetracer-trace-format"
            echo "codetracer-native-recorder"
            echo "codetracer-native-backend"
            echo "codetracer-visual-replay"
            echo "nim-stackable-hooks"
            echo "codetracer-ruby-recorder"
            echo "codetracer-python-recorder"
            echo "codetracer-polkavm-recorder"
            echo "TFN_DOWNSTREAM_SIBLINGS_EOF"
          } >>"${GITHUB_OUTPUT}"

      - name: Mint installation token for cross-repo sibling access
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout the commit under test (the workspace root)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Clone codetracer at the pinned revision
        uses: metacraft-labs/metacraft-github-actions/git-auth@dev
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}
          working-directory: ${{ github.workspace }}
          run: |
            set -euo pipefail
            ct_dir="${{ steps.plan.outputs.ct-dir }}"
            rm -rf "${ct_dir}"
            git init -q "${ct_dir}"
            git -C "${ct_dir}" remote add origin https://github.com/metacraft-labs/codetracer
            git -C "${ct_dir}" fetch -q --depth 1 origin "${{ steps.plan.outputs.ct-rev }}"
            git -C "${ct_dir}" -c advice.detachedHead=false checkout -q FETCH_HEAD
            git -C "${ct_dir}" submodule update -q --init --recursive --depth 1
            echo "codetracer at $(git -C "${ct_dir}" rev-parse HEAD)"

      - name: Refuse a codetracer revision that lacks what this lane runs
        # Every codetracer file a later step runs or reads is checked here, so
        # a pin that is too old (or too new, after a rename) fails in seconds,
        # by name, instead of as `No such file or directory` after the dev
        # shell has been realised.
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
        run: |
          set -euo pipefail
          for path in ci/launcher-recorder-e2e-resolve-siblings.sh ci/repro-lock-build-input-siblings.sh \
                      ci/prefetch-ci-flake-inputs.sh ci/lib/run-nim-test-lane.sh ci/lib/test-lane-files.sh \
                      .github/actions/provision-repro-lock-siblings/action.yml \
                      ci/test/siblings/repro.lock; do
            if [ ! -f "${CT_DIR}/${path}" ]; then
              echo "::error::the codetracer revision under test ($(git -C "${CT_DIR}" rev-parse HEAD)) has no ${path}, which this lane uses. Move the pin in ci/downstream/repro.lock (or the dispatch input) to a revision that has it."
              exit 1
            fi
            echo "  OK   ${CT_DIR}/${path}"
          done
          # The lanes ci/downstream/ct-reader-suites.sh selects reader suites
          # from (CT_LANES in ci/downstream/run-consumers.sh).
          lanes="$(sed -n 's/^CT_LANES=(\(.*\))$/\1/p' ci/downstream/run-consumers.sh)"
          if [ -z "${lanes}" ]; then
            echo "::error::ci/downstream/run-consumers.sh declares no CT_LANES."
            exit 1
          fi
          for lane in ${lanes}; do
            if ! grep -qE "^[[:space:]]+${lane}\)" "${CT_DIR}/ci/lib/test-lane-files.sh"; then
              echo "::error::the codetracer revision under test defines no '${lane}' lane in ci/lib/test-lane-files.sh; move the pin, or update ci/downstream/run-consumers.sh."
              exit 1
            fi
          done
          if ! grep -q '^  codetracer-dir:' "${CT_DIR}/.github/actions/provision-repro-lock-siblings/action.yml"; then
            echo "::error::the codetracer revision under test predates provision-repro-lock-siblings' codetracer-dir input; move the pin forward."
            exit 1
          fi

      - name: Resolve every sibling from codetracer's locks and homes
        id: resolve
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
          PLANNED: ${{ steps.plan.outputs.siblings }}
        run: |
          set -euo pipefail
          bash "${CT_DIR}/ci/launcher-recorder-e2e-resolve-siblings.sh" \
            --ct-dir "${CT_DIR}" --self codetracer-trace-format-nim --planned "${PLANNED}" \
            --out "${GITHUB_OUTPUT}"

      - name: Setup dev env + clone the private siblings
        # Only the PRIVATE siblings go through here, each as `<name>=<rev>`
        # from its one home at the codetracer revision. This repository is
        # listed too: clone-siblings skips an entry naming the triggering
        # repository, so it keeps the list non-empty (an empty list would fall
        # back to this repository's own sibling list).
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          # The job outlives the token's hour; with the App's id and key the
          # credential broker re-mints the Nix GitHub credential in place.
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          app-private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          siblings: |
            codetracer-trace-format-nim
            ${{ steps.resolve.outputs.private }}

      - name: Stage codetracer's provisioning action at the revision under test
        # `uses:` cannot take an expression, so the action is copied from the
        # codetracer checkout and used from there: the action that provisions
        # the siblings is the one at the revision whose locks it reads.
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.tfn-downstream-actions/provision-repro-lock-siblings"
          cp "${CT_DIR}/.github/actions/provision-repro-lock-siblings/action.yml" \
            "${GITHUB_WORKSPACE}/.tfn-downstream-actions/provision-repro-lock-siblings/action.yml"

      - name: Clone the public siblings from codetracer's locks
        # `exclude:` is what keeps THIS checkout in place: codetracer's
        # repro.lock pins codetracer-trace-format-nim too, and without it the
        # action would reset this directory to that revision.
        uses: ./.tfn-downstream-actions/provision-repro-lock-siblings
        with:
          codetracer-dir: ${{ steps.plan.outputs.ct-dir }}
          exclude: codetracer-trace-format-nim
          test-siblings: ${{ steps.resolve.outputs.test-siblings }}
          root-default-shell: "false"
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Confirm the commit under test is still the sibling
        shell: bash
        env:
          SELF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
          if [ "${head}" != "${SELF_SHA}" ]; then
            echo "::error::${GITHUB_WORKSPACE} is at ${head}, not the commit under test ${SELF_SHA}: provisioning reset it."
            exit 1
          fi
          echo "codetracer-trace-format-nim sibling: ${head}"

      - name: Fetch every flake input later steps evaluate, while the token is valid
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
        run: |
          set -euo pipefail
          PARENT="$(cd "${CT_DIR}/.." && pwd)"
          bash "${CT_DIR}/ci/prefetch-ci-flake-inputs.sh" --ct-dir "${CT_DIR}" \
            "${CT_DIR}:ci" \
            "${GITHUB_WORKSPACE}:default" \
            "${PARENT}/codetracer-native-recorder:default" \
            "${PARENT}/codetracer-ruby-recorder:default" \
            "${PARENT}/codetracer-python-recorder:default" \
            "${PARENT}/codetracer-polkavm-recorder:default"

      - name: Allow direnv in the freshly cloned siblings
        # Recipes in the native recorder and codetracer's db-backend build
        # `direnv exec <sibling>`, and a fresh clone's .envrc is blocked.
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
        run: |
          set -euo pipefail
          cd "${CT_DIR}"
          PARENT="$(cd .. && pwd)"
          for dir in "${GITHUB_WORKSPACE}" "${PARENT}/codetracer-native-recorder" "${PARENT}/codetracer-native-backend" \
                     "${PARENT}/codetracer-ruby-recorder" "${PARENT}/codetracer-python-recorder" "${PARENT}/codetracer-polkavm-recorder"; do
            if [ -f "${dir}/.envrc" ]; then
              nix develop '.?submodules=1#ci' --command direnv allow "${dir}"
              echo "direnv allow: ${dir}"
            fi
          done

      # One step per consumer, each run whatever happened to the previous one,
      # so one red consumer does not hide the others. Each ends with a
      # TEST-COUNTS line and fails on a failure or on zero tests.
      - name: codetracer-readers
        if: success() || failure()
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
        run: bash ci/downstream/run-consumers.sh --ct-dir "${CT_DIR}" codetracer-readers

      - name: codetracer-native-recorder
        if: success() || failure()
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
        run: bash ci/downstream/run-consumers.sh --ct-dir "${CT_DIR}" codetracer-native-recorder

      - name: codetracer-ruby-recorder
        if: success() || failure()
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
        run: bash ci/downstream/run-consumers.sh --ct-dir "${CT_DIR}" codetracer-ruby-recorder

      - name: codetracer-python-recorder
        if: success() || failure()
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
        run: bash ci/downstream/run-consumers.sh --ct-dir "${CT_DIR}" codetracer-python-recorder

      - name: codetracer-polkavm-recorder
        if: success() || failure()
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
        run: bash ci/downstream/run-consumers.sh --ct-dir "${CT_DIR}" codetracer-polkavm-recorder

      - name: Upload the consumer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-consumer-logs
          path: ${{ github.workspace }}/build/downstream-logs/
          retention-days: 14
          if-no-files-found: ignore
